<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode: "class", theme: {extend: {colors: {background: "#fff8f1", "on-primary-fixed": "#2d1600", "inverse-surface": "#33302b", "tertiary-fixed": "#f5dfcd", parchment: "#fdf6ee", "surface-container-high": "#eee7df", "on-error": "#ffffff", "on-secondary": "#ffffff", "inverse-primary": "#ebbe95", outline: "#81756b", "on-secondary-container": "#581300", "secondary-fixed-dim": "#ffb5a0", "surface-container-highest": "#e8e1da", tertiary: "#1e140a", error: "#ba1a1a", "error-container": "#ffdad6", pebble: "#d9cfc3", "outline-variant": "#d3c4b8", secondary: "#b02f00", "on-error-container": "#93000a", surface: "#fff8f1", "saffron-pulse": "#ff5c00", "ink-black": "#000000", "ember-orange": "#f65726", sepia: "#2b180a", primary: "#241100", "secondary-fixed": "#ffdbd1", "surface-bright": "#fff8f1", "tertiary-fixed-dim": "#d8c3b2", "surface-container": "#f4ede5", "soft-cream": "#f0e6dc", "on-surface": "#1e1b17", "on-secondary-fixed": "#3b0900", "on-tertiary-fixed": "#25190f", "surface-container-low": "#f9f3eb", "on-tertiary-container": "#a18e7f", "surface-tint": "#795736", "primary-fixed": "#ffdcbe", "secondary-container": "#ff5d2c", "on-surface-variant": "#4f453c", "on-primary": "#ffffff", "on-background": "#1e1b17", "peach-glow": "#fed0b3", chestnut: "#3e2407", "primary-fixed-dim": "#ebbe95", "tertiary-container": "#34281d", driftwood: "#94877c", "primary-container": "#3e2407", bronze: "#7f6e60", "on-tertiary-fixed-variant": "#534438", "on-primary-fixed-variant": "#5f4021", "on-secondary-fixed-variant": "#872200", "charcoal-bark": "#21201c", "surface-dim": "#dfd9d1", stone: "#a99d93", "surface-container-lowest": "#ffffff", "on-tertiary": "#ffffff", "surface-variant": "#e8e1da", "on-primary-container": "#b18964", "pure-card": "#ffffff", "inverse-on-surface": "#f7f0e8"}, borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}, spacing: {gutter: "1.5rem", "gutter-mobile": "1rem", "space-xl": "2.5rem", "space-sm": "0.5rem", "space-lg": "1.5rem", "margin-mobile": "1.25rem", "space-xs": "0.25rem", margin: "3rem", "space-md": "1rem"}, fontFamily: {"headline-md": ["EB Garamond"], "label-sm": ["Inter"], "headline-lg": ["EB Garamond"], "body-lg": ["Inter"], "body-sm": ["Inter"], "headline-sm": ["EB Garamond"], "label-lg": ["Inter"], "headline-xl": ["EB Garamond"], "body-md": ["Inter"], "headline-xl-mobile": ["EB Garamond"], "headline-lg-mobile": ["EB Garamond"], "label-md": ["Inter"], headline: ["EB Garamond"], display: ["EB Garamond"], body: ["Inter"], label: ["Inter"]}, fontSize: {"headline-md": ["28px", {lineHeight: "36px", letterSpacing: "-0.01em", fontWeight: "400"}], "label-sm": ["11px", {lineHeight: "14px", letterSpacing: "0.03em", fontWeight: "500"}], "headline-lg": ["40px", {lineHeight: "48px", letterSpacing: "-0.015em", fontWeight: "300"}], "body-lg": ["18px", {lineHeight: "28px", fontWeight: "400"}], "body-sm": ["13px", {lineHeight: "20px", fontWeight: "400"}], "headline-sm": ["22px", {lineHeight: "28px", fontWeight: "400"}], "label-lg": ["14px", {lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "500"}], "headline-xl": ["56px", {lineHeight: "64px", letterSpacing: "-0.02em", fontWeight: "300"}], "body-md": ["15px", {lineHeight: "24px", fontWeight: "400"}], "headline-xl-mobile": ["40px", {lineHeight: "48px", letterSpacing: "-0.015em", fontWeight: "300"}], "headline-lg-mobile": ["32px", {lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "300"}], "label-md": ["12px", {lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "500"}]}}}};</script></head><body class="bg-parchment font-body-md text-on-surface antialiased"><main class="min-h-screen w-full flex items-center justify-center p-space-md bg-parchment"><div class="flex flex-col w-full items-center justify-center relative overflow-hidden py-12 px-4 selection:bg-peach-glow selection:text-chestnut">
<!-- Radial warmth & atmospheric orbit arcs reminiscent of Delphi -->
<div class="pointer-events-none absolute inset-0 flex items-center justify-center overflow-hidden">
<!-- Warm amber / peach diffuse bloom -->
<div class="absolute w-[680px] h-[680px] -top-32 rounded-full bg-peach-glow/35 blur-3xl"></div>
<div class="absolute w-[440px] h-[440px] top-1/4 rounded-full bg-secondary-fixed/20 blur-2xl"></div>
<!-- Editorial orbital concentric fine lines -->
<svg class="absolute w-[780px] h-[780px] opacity-40 text-pebble" fill="none" stroke="currentColor" viewbox="0 0 800 800">
<circle cx="400" cy="400" r="240" stroke-dasharray="3 4" stroke-width="1"></circle>
<circle cx="400" cy="400" r="330" stroke-width="1"></circle>
<circle cx="400" cy="400" r="390" stroke-dasharray="2 6" stroke-width="0.75"></circle>
</svg>
</div>
<!-- Sign In Card Container (400px - 440px) -->
<div class="relative w-full max-w-[430px] z-10">
<div class="bg-pure-card rounded-2xl p-8 sm:p-10 shadow-xl shadow-peach-glow/30 border border-pebble backdrop-blur-sm transition-all duration-300">
<!-- Top Brand Header: Mark & Name -->
<div class="flex flex-col items-center text-center">
<div class="w-11 h-11 rounded-full bg-surface-container-low flex items-center justify-center border border-pebble/60 mb-3 text-sepia">
<!-- Delphi/MindMate Spark Icon -->
<svg class="w-5 h-5 text-sepia" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M4.93 19.07l14.14-14.14"></path>
</svg>
</div>
<span class="font-headline-sm text-headline-sm text-sepia tracking-tight font-normal">MindMate AI</span>
</div>
<!-- Welcome Title & Subtitle -->
<div class="text-center mt-6 mb-7">
<h1 class="font-headline-md text-headline-md text-sepia font-normal tracking-tight">Welcome back</h1>
<p class="font-label-lg text-label-lg text-bronze mt-1">Sign in to continue to MindMate</p>
</div>
<!-- Sign In Form -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-1.5">
<label class="block font-label-sm text-label-sm uppercase tracking-widest text-driftwood font-medium" for="email">
            Email Address
          </label>
<div class="relative">
<input class="w-full bg-parchment text-sepia font-body-md text-body-md rounded-xl px-3.5 py-2.5 border border-pebble focus:outline-none focus:border-ember-orange focus:ring-2 focus:ring-peach-glow/50 transition-colors" id="email" placeholder="name@domain.com" required="" type="email" value="pramod@example.com"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5 pt-0.5">
<div class="flex items-center justify-between">
<label class="block font-label-sm text-label-sm uppercase tracking-widest text-driftwood font-medium" for="password">
              Password
            </label>
<a class="font-label-md text-label-md text-ember-orange hover:text-secondary font-medium transition-colors" href="#">
              Forgot password?
            </a>
</div>
<div class="relative flex items-center">
<input class="w-full bg-parchment text-sepia font-body-md text-body-md rounded-xl pl-3.5 pr-11 py-2.5 border border-error/70 focus:outline-none focus:border-error focus:ring-2 focus:ring-error-container/60 transition-colors" id="password" placeholder="Enter your password" required="" type="password" value="••••••••••••"/>
<button aria-label="Toggle password visibility" class="absolute right-3 text-stone hover:text-charcoal-bark p-1 transition-colors flex items-center justify-center" id="toggle-pwd-btn" onclick="const p = document.getElementById('password'); const icon = document.getElementById('pwd-icon'); if (p.type === 'password') { p.type = 'text'; icon.textContent = 'visibility_off'; } else { p.type = 'password'; icon.textContent = 'visibility'; }" type="button">
<span class="material-symbols-outlined text-[19px]" id="pwd-icon">visibility</span>
</button>
</div>
<!-- Inline Error Alert -->
<div class="flex items-center gap-1.5 pt-1 text-error" role="alert">
<span class="material-symbols-outlined text-[15px]" style="font-variation-settings: 'FILL' 1;">error</span>
<span class="font-label-md text-label-md font-medium tracking-tight">Incorrect email or password.</span>
</div>
</div>
<!-- Primary Action Button -->
<div class="pt-2">
<button class="group w-full bg-chestnut hover:bg-sepia text-parchment font-label-lg text-label-lg font-medium py-3 px-5 rounded-xl shadow-md shadow-peach-glow/50 flex items-center justify-center gap-2 transition-all duration-200 active:scale-[0.99]" type="submit">
<span>Sign in</span>
<span class="material-symbols-outlined text-[18px] transition-transform duration-200 group-hover:translate-x-0.5">arrow_forward</span>
</button>
</div>
</form>
<!-- Divider -->
<div class="relative my-6 flex items-center justify-center">
<div class="w-full border-t border-pebble"></div>
<span class="absolute bg-pure-card px-3 font-label-md text-label-md text-bronze uppercase tracking-wider">or</span>
</div>
<!-- Google OAuth Button -->
<button class="w-full bg-pure-card hover:bg-surface-container-low text-sepia font-label-lg text-label-lg font-medium py-2.5 px-4 rounded-xl border border-pebble flex items-center justify-center gap-3 transition-colors duration-150" type="button">
<!-- Google G Symbol -->
<svg class="w-4 h-4 shrink-0" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span>Continue with Google</span>
</button>
<!-- Footer Callout -->
<div class="text-center mt-6 pt-1">
<p class="font-body-sm text-body-sm text-on-surface-variant">
          Don't have an account? 
          <a class="font-medium text-ember-orange hover:text-chestnut transition-colors ml-1" href="#">Sign up</a>
</p>
</div>
</div>
<!-- Editorial Assurance Notes Below Card -->
<div class="mt-6 flex flex-wrap items-center justify-center gap-x-2 gap-y-1 text-center px-2">
<span class="font-label-md text-label-md text-bronze">Remembers what matters</span>
<span class="text-stone select-none">•</span>
<span class="font-label-md text-label-md text-bronze">Acts only with your approval</span>
<span class="text-stone select-none hidden sm:inline">•</span>
<span class="font-label-md text-label-md text-bronze w-full sm:w-auto">Finds anything you've discussed</span>
</div>
</div>
</div></main></body></html>
